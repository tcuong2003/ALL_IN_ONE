<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Premium Luminous Tech Gradient -->
    <linearGradient id="aio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Top Specular Sheen (Subtle Glass Effect) -->
    <linearGradient id="aio-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Refined Soft Drop Shadow for Letters -->
    <filter id="aio-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#aio-bg)"/>
  
  <!-- Subtle Glass Highlight Arc -->
  <path d="M 5 5 Q 64 2 123 5 C 123 38 90 44 64 44 C 38 44 5 38 5 5 Z" fill="url(#aio-sheen)"/>
  
  <!-- Outer Border Stroke -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="rgba(255, 255, 255, 0.32)" stroke-width="2"/>

  <!-- 'ALL' Monogram in Pure Bright Luminous White -->
  <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#aio-shadow)">
    <!-- Letter A -->
    <path d="M 22 96 L 40 32 L 58 96"/>
    <path d="M 28 73 L 52 73"/>

    <!-- Letter L 1 -->
    <path d="M 70 32 L 70 96 L 86 96"/>

    <!-- Letter L 2 -->
    <path d="M 93 32 L 93 96 L 109 96"/>
  </g>
</svg>
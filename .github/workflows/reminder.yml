name: Push Reminder Cron

on:
  schedule:
    # Chạy mỗi giờ một lần (phút 0) để kiểm tra đúng giờ người dùng hẹn (ví dụ: 20:00, 21:00, 22:00 VN)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Cho phép bấm nút "Run workflow" trên GitHub bất kỳ lúc nào để test

jobs:
  send-reminder:
    name: Check & Deliver Daily Ledger Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-push
        run: npm install web-push

      - name: Run Reminder Dispatcher
        run: node scripts/send-reminders.js

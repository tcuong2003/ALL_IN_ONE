name: Push Reminder Cron

on:
  # Kích hoạt tức thì từ Upstash QStash qua webhook API (chạy ngay trong 3-5 giây)
  repository_dispatch:
    types: [send_reminder]
  # Kích hoạt thủ công từ giao diện GitHub Actions (nút Run workflow)
  workflow_dispatch:
  # Lịch dự phòng của GitHub (14:00 UTC = 21:00 VN)
  schedule:
    - cron: '0 14 * * *'

jobs:
  send-reminder:
    name: Check & Deliver Daily Ledger Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-push
        run: npm install web-push

      - name: Run Reminder Dispatcher
        env:
          FORCE_SEND: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
        run: node scripts/send-reminders.js
